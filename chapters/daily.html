<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Baker Campaign — Cat Society Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/style.css?v=3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🥐%3C/text%3E%3C/svg%3E">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
</head>
<body>
  <div class="toast-host" id="toast-host"></div>

  <div class="shell">
    <header class="topbar"></header>

    <div class="progress-track" id="progress"></div>

    <div class="scene" id="scene"></div>

    <div class="dashboard-strip" id="dashboard"></div>

    <div id="day-host"></div>

    <h2>📔 Logbook</h2>
    <div id="logbook"></div>

    <h2>🏆 Achievements</h2>
    <div id="ach"></div>
  </div>

  <script type="module">
    import { State } from "../assets/js/state.js?v=3";
    import { DAYS, getDay, flavorLine } from "../assets/js/data/days.js?v=3";
    import { CATS, purchase } from "../assets/js/data/cats.js?v=3";

    const ACHIEVEMENTS = [
      { id: "first-sale",    label: "🥇 First Sale", check: b => b.daysCompleted.length >= 1 },
      { id: "rich",          label: "💰 100+ coin day", check: (b, last) => last && last.cashDelta >= 100 },
      { id: "five-star",     label: "⭐ 5-star reputation", check: b => b.reputation >= 4.8 },
      { id: "tax-survivor",  label: "🔥 Survived the sugar tax", check: b => b.daysCompleted.includes(5) && b.cash > 0 },
      { id: "monopolist",    label: "👑 Became monopolist", check: b => b.daysCompleted.includes(9) },
      { id: "lerner-master", label: "🧮 Half-pass-through nailed", check: b => b.daysCompleted.includes(10) },
      { id: "bankruptcy",    label: "💸 Recovered from bankruptcy", check: b => b.loansTaken >= 1 },
      { id: "graduate",      label: "🎓 Master Baker certification", check: b => b.graduated },
      { id: "perfect-day",   label: "💯 Aced a day (≥95%)", check: (b, last) => last && last.repDelta >= 0.25 },
      { id: "streak-3",      label: "🔥 3-day excellence streak", check: b => computeStreak(b) >= 3 },
    ];

    // simple streak: consecutive days with repDelta > 0
    function computeStreak(b) {
      let streak = 0;
      for (const e of b.log) {
        if (e.repDelta > 0) streak += 1;
        else break;
      }
      return streak;
    }

    function toast(message, kind = "win", headline = "") {
      const host = document.getElementById("toast-host");
      const el = document.createElement("div");
      el.className = "toast " + kind;
      el.innerHTML = `${headline ? `<div class="head">${headline}</div>` : ""}<div>${message}</div>`;
      host.appendChild(el);
      setTimeout(() => {
        el.style.animation = "toastOut 0.35s forwards";
        setTimeout(() => el.remove(), 360);
      }, 4500);
    }

    function renderProgress(b) {
      const track = document.getElementById("progress");
      track.innerHTML = "";
      for (let i = 1; i <= 10; i++) {
        const pip = document.createElement("div");
        let cls = "pip";
        if (b.daysCompleted.includes(i)) cls += " done";
        else if (i === b.day && !b.graduated) cls += " current";
        pip.className = cls;
        pip.title = `Day ${i}` + (b.daysCompleted.includes(i) ? " ✓" : "");
        track.appendChild(pip);
      }
    }

    function renderScene(b) {
      const day = getDay(b.graduated ? 10 : b.day);
      const w = day?.weather || { emoji: "🌙", line: "Quiet night at the bakery." };
      const streak = computeStreak(b);
      document.getElementById("scene").innerHTML = `
        <div class="weather">${w.emoji}</div>
        <div class="scene-text"><span class="accent">${day?.title || "Closed for renovations."}</span><br>${w.line}</div>
        <div class="streak">🔥 streak ${streak}</div>
      `;
    }

    function renderDashboard(b) {
      document.getElementById("dashboard").innerHTML = `
        <div class="kpi"><span class="label">Day</span><span class="value">${b.day}/10</span></div>
        <div class="kpi"><span class="label">💰 Cash</span><span class="value ${b.cash < 0 ? "bad" : b.cash > 200 ? "good" : ""}">${b.cash.toFixed(0)}</span></div>
        <div class="kpi"><span class="label">⭐ Rep</span><span class="value">${b.reputation.toFixed(1)}/5</span></div>
        <div class="kpi"><span class="label">🏆 Badges</span><span class="value">${b.achievements.length}/${ACHIEVEMENTS.length}</span></div>
        <div class="kpi"><span class="label">📚 Loans</span><span class="value">${b.loansTaken}</span></div>
      `;
    }

    function renderHeader(b) {
      const root = document.querySelector("header.topbar");
      root.innerHTML = `
        <div>
          <h1>🏪 Master Baker</h1>
          <div class="crumbs">${b.graduated ? "Certified — Royal Examination awaits" : `Day ${b.day} of 10`}</div>
        </div>
        <a class="home" href="../index.html">← Map</a>
      `;
    }

    function renderDay(b) {
      const host = document.getElementById("day-host");
      host.innerHTML = "";

      if (b.graduated) {
        host.innerHTML = `
          <div class="consequence-banner win" style="text-align:center; font-size:1.05em;">
            🎓 <strong>Congratulations, Master Baker.</strong><br>
            You survived 10 days. The Royal Examiners are ready to certify you.
            <p style="margin-top:14px;">
              <a class="bigbtn" style="display:inline-block;" href="final-mock.html">🏛️ Open the Royal Examination Room →</a>
            </p>
            <p><small>Want another playthrough?
              <button class="ghost small" id="restart-btn">Restart campaign</button>
            </small></p>
          </div>
        `;
        document.getElementById("restart-btn")?.addEventListener("click", () => {
          if (confirm("Restart the campaign? (Chapter scores are preserved.)")) {
            State.resetBakery();
            location.reload();
          }
        });
        return;
      }

      const day = getDay(b.day);
      if (!day) {
        host.innerHTML = `<div class="card">No day data found for day ${b.day}. <a href="../index.html">Back to map</a></div>`;
        return;
      }

      const letter = day.letter();

      host.innerHTML = `
        <h2 style="margin-top:18px;">Day ${day.day} — ${day.title}</h2>
        <div class="letter">
          <div class="from">${letter.from}</div>
          <div class="body">${letter.body}</div>
        </div>
        <div class="card">
          <h3>Your decision</h3>
          <p style="font-size:0.92em; color:var(--ink-soft); margin-top:-4px;">Fill each field, then press <strong>Enter</strong> or click Send. Tolerance shown beneath each box.</p>
          ${day.fields.map((f, i) => `
            <div class="field-row">
              <div>
                <label for="f-${f.id}">${f.label}</label>
                <span class="hint-text">tolerance ±${f.tol}${f.hint ? ` · 🐾 ${f.hint}` : ""}</span>
              </div>
              <input id="f-${f.id}" type="number" step="0.01" class="cell" placeholder="number" inputmode="decimal" ${i === 0 ? "autofocus" : ""}>
            </div>
          `).join("")}
          <button id="submit" class="bigbtn">📤 Send my answer to the bakery →</button>
          <p style="font-size:0.85em; color:var(--muted); margin-top:12px; text-align:center;">
            Stuck? Open a reference notebook in a new tab —
            <a target="_blank" rel="noopener" href="${refLink(day.chapterRef.id)}">📚 ${day.chapterRef.label}</a>
          </p>
        </div>
        <div id="consequence"></div>
      `;

      const submitBtn = document.getElementById("submit");
      submitBtn.addEventListener("click", () => submit(day, letter));
      document.querySelectorAll(".field-row input").forEach(inp => {
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); submit(day, letter); }
        });
      });
      const first = document.querySelector(".field-row input");
      if (first) setTimeout(() => first.focus(), 100);

      typesetMath();
    }

    function refLink(chapterId) {
      const map = {
        0: "0-bakery-preparation.html",
        1: "1-market-day.html",
        2: "2-sugar-tax.html",
        3: "3-tariffs.html",
        4: "4-oven-smoke.html",
        5: "5-lemon-loaves.html",
        6: "6-monopoly.html",
      };
      return map[chapterId] || "../index.html";
    }

    function typesetMath() {
      // KaTeX auto-render with $...$ and $$...$$ delimiters
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
            ],
            throwOnError: false,
            errorColor: "#e08c6e",
          });
        } catch (e) {
          console.warn("KaTeX render error:", e);
        }
      }
    }

    function submit(day, letter) {
      const answers = {};
      const missing = [];
      day.fields.forEach(f => {
        const el = document.getElementById("f-" + f.id);
        const v = parseFloat(el.value);
        answers[f.id] = v;
        if (!isFinite(v)) {
          missing.push(f.label);
          el.classList.add("wrong");
        } else {
          el.classList.remove("wrong");
        }
      });
      if (missing.length) {
        const c = document.getElementById("consequence");
        c.innerHTML = `<div class="consequence-banner fail">⚠️ Please fill in: <strong>${missing.join(", ")}</strong>. Type a number then press Enter or click Send.</div>`;
        c.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      const result = day.grade(letter, answers);

      // cat queue cinematic
      const queue = buildQueue(day);
      const queueHTML = queue.map(q => `
        <div class="queue-row">
          <div class="portrait">${q.cat.emoji}</div>
          <div>
            <div class="name">${q.cat.name}</div>
            <div class="reason">${q.result.reason || q.cat.blurb}</div>
            <div class="bubble">"${flavorLine(q.result.satisfied)}"</div>
          </div>
          <div class="verdict">${q.result.satisfied ? "😺" : "😾"}</div>
        </div>
      `).join("");

      State.applyDayResult({
        day: day.day,
        title: day.title,
        yourAnswer: answers,
        correctAnswer: result.targets,
        cashDelta: result.cashDelta,
        repDelta: result.repDelta,
        summary: result.summary,
      });

      // achievements
      const newState = State.bakery();
      ACHIEVEMENTS.forEach(a => {
        if (!newState.achievements.includes(a.id) && a.check(newState, newState.log[0])) {
          if (State.awardAchievement(a.id)) toast(a.label, "win", "🏆 Achievement!");
        }
      });

      const finalState = State.bakery();
      const bankrupt = finalState.cash < 0;

      const verdictClass = result.score >= 80 ? "win" : result.score >= 50 ? "" : "fail";
      const verdictTxt = result.score >= 80 ? "Excellent." : result.score >= 50 ? "Workable." : "Painful.";

      const c = document.getElementById("consequence");
      c.innerHTML = `
        <div class="consequence-banner ${verdictClass}">
          <strong>${verdictTxt}</strong> Score: ${Math.round(result.score)}/100 ·
          Cash ${result.cashDelta >= 0 ? "+" : ""}${result.cashDelta} ·
          Reputation ${result.repDelta >= 0 ? "+" : ""}${result.repDelta.toFixed(1)} ⭐
        </div>
        <div class="card">
          <h3>What actually happened</h3>
          <p>${result.summary}</p>
          ${queueHTML.length ? `<h4 style="margin-top:14px">The day's customers</h4>${queueHTML}` : ""}
        </div>
        ${bankrupt ? `
          <div class="consequence-banner fail" style="text-align:center">
            💸 You are out of coins. The Whiskerton Mutual Cat Bank offers a 50-coin loan.
            <p style="margin-top:8px;"><button id="loan-btn">Take the 50-coin loan</button></p>
          </div>` : ""}
        ${day.day === 10 ? `
          <div class="consequence-banner win" style="text-align:center; margin-top:16px;">
            🎓 You have completed the campaign. The Royal Examiners await.
            <p style="margin-top:8px;"><a class="bigbtn" style="display:inline-block;" href="final-mock.html">Take the Royal Exam →</a></p>
          </div>
        ` : `
          <p style="text-align:center; margin-top:18px;">
            <button id="sleep" class="bigbtn" style="max-width:320px; margin:0 auto;">🌙 Sleep until Day ${day.day + 1} →</button>
          </p>
        `}
      `;

      submitBtn.disabled = true;
      const sleep = document.getElementById("sleep");
      if (sleep) sleep.addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); render(); });
      const loanBtn = document.getElementById("loan-btn");
      if (loanBtn) loanBtn.addEventListener("click", () => { State.takeLoan(50); render(); });

      renderHeader(finalState); renderDashboard(finalState); renderProgress(finalState); renderScene(finalState); renderLogbook(finalState); renderAchievements(finalState);
      typesetMath();

      c.scrollIntoView({ behavior: "smooth", block: "start" });

      // celebratory toast
      if (result.score >= 90) toast("Cats are purring 🐾", "win", `Day ${day.day} mastered`);
      else if (result.score < 40) toast("Reputation took a hit. Reference notebook open in new tab?", "bad", `Day ${day.day} — rough day`);
    }

    function buildQueue(day) {
      const rosters = {
        1: ["penny", "engineer"],
        2: ["penny", "tim"],
        3: ["penny", "engineer", "tim"],
        4: ["penny", "engineer", "inspector"],
        5: ["penny", "pawley", "furrington"],
        6: ["penny", "cream", "engineer"],
        7: ["penny", "inspector"],
        8: ["inspector", "cream", "penny"],
        9: ["penny", "pawley", "engineer", "tim"],
        10: ["penny", "pawley", "cream", "engineer"],
      };
      const ids = rosters[day.day] || ["penny"];
      const prices = { loaf: 3, baguette: 4, croissant: 8, cake: 12, cupcake: 5 };
      return ids.map(id => {
        const cat = CATS[id];
        const result = purchase(cat, prices, day.day < 8);
        return { cat, result };
      });
    }

    function renderLogbook(b) {
      const host = document.getElementById("logbook");
      if (!b.log.length) {
        host.innerHTML = `<p style="color:var(--ink-soft); font-style:italic;">No entries yet — your decisions will be recorded here as you play.</p>`;
        return;
      }
      host.innerHTML = b.log.map(e => `
        <div class="logbook-entry ${e.cashDelta >= 0 ? "win" : "fail"}">
          <div class="day">Day ${e.day} — ${e.title}</div>
          <div class="summary">${e.summary}</div>
          <div class="summary">Cash ${e.cashDelta >= 0 ? "+" : ""}${e.cashDelta} · Rep ${e.repDelta >= 0 ? "+" : ""}${e.repDelta.toFixed(1)}</div>
        </div>
      `).join("");
      typesetMath();
    }

    function renderAchievements(b) {
      const host = document.getElementById("ach");
      host.innerHTML = ACHIEVEMENTS.map(a => `
        <span class="achievement ${b.achievements.includes(a.id) ? "" : "locked"}">${a.label}</span>
      `).join("");
    }

    function render() {
      try {
        const b = State.bakery();
        renderHeader(b);
        renderProgress(b);
        renderScene(b);
        renderDashboard(b);
        renderDay(b);
        renderLogbook(b);
        renderAchievements(b);
      } catch (e) {
        document.getElementById("day-host").innerHTML = `
          <div class="errpanel">
            <strong>Something broke while rendering the campaign:</strong>
            ${e.message}\n\n${e.stack || ""}
            <br><br>
            Try <button class="ghost small" onclick="if(confirm('Reset bakery state?')){CatBakeryState.resetBakery();location.reload();}">Reset bakery</button>
          </div>
        `;
      }
    }

    // wait for KaTeX auto-render to be available
    function init() {
      if (!window.renderMathInElement) {
        return setTimeout(init, 100);
      }
      render();
    }
    init();
  </script>
</body>
</html>
