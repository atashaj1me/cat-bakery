<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Baker Campaign — Cat Society Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <link rel="stylesheet" href="../assets/css/style.css?v=11">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🥐%3C/text%3E%3C/svg%3E">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
</head>
<body>
  <div class="toast-host" id="toast-host"></div>

  <div class="shell">
    <header class="topbar"></header>

    <div class="progress-track" id="progress"></div>
    <div class="scene" id="scene"></div>
    <div class="dashboard-strip" id="dashboard"></div>

    <div id="day-host"></div>

    <h2>📔 Logbook</h2>
    <div id="logbook"></div>

    <h2>🏆 Achievements</h2>
    <div id="ach"></div>
  </div>

  <script type="module">

    import "../assets/js/red-hot-pan.js?v=11";
    import { State } from "../assets/js/state.js?v=11";
    import { DAYS, getDay, flavorLine } from "../assets/js/data/days.js?v=11";
    import { HELL_DAYS, getHellDay } from "../assets/js/data/days-hell.js?v=11";
    import { APOCALYPSE_DAYS, getApocalypseDay } from "../assets/js/data/days-apocalypse.js?v=11";
    import { ARC_SCROLLS, NPC_INTERJECTIONS, MEMORY_TEMPLATES } from "../assets/js/data/lore-apocalypse.js?v=11";
    import { CATS, purchase } from "../assets/js/data/cats.js?v=11";
    import { TECHS, TECH_LIST, getTech, rollTech } from "../assets/js/data/technologies.js?v=11";
    import { FINAL_MOCK, MOCK_REMEDIATION } from "../assets/js/data/mcqs.js?v=11";
    import { tryUnlockCheats } from "../assets/js/cheats.js?v=11";
    import { CHEAT_BY_ID } from "../assets/js/data/cheatsheets.js?v=11";

    // --- mode detection from URL ---
    const urlParams = new URLSearchParams(window.location.search);
    const raw_mode = urlParams.get("mode");
    const MODE = raw_mode === "apocalypse" ? "apocalypse" : raw_mode === "hell" ? "hell" : "vanilla";
    const TOTAL_DAYS = MODE === "apocalypse" ? 16 : MODE === "hell" ? 14 : 10;
    const DAY_GETTER = MODE === "apocalypse" ? getApocalypseDay : MODE === "hell" ? getHellDay : getDay;
    const DAY_LIST   = MODE === "apocalypse" ? APOCALYPSE_DAYS  : MODE === "hell" ? HELL_DAYS  : DAYS;

    State.setMode(MODE);

    const ACHIEVEMENTS = [
      { id: "first-sale",     label: "🥇 First Sale", check: b => (b.daysCompleted.length + b.hellDaysCompleted.length) >= 1 },
      { id: "rich",           label: "💰 100+ coin day", check: (b, last) => last && last.cashDelta >= 100 },
      { id: "five-star",      label: "⭐ 5-star reputation", check: b => b.reputation >= 4.8 || b.hellReputation >= 4.8 },
      { id: "tax-survivor",   label: "🔥 Survived the sugar tax", check: b => b.daysCompleted.includes(5) && b.cash > 0 },
      { id: "monopolist",     label: "👑 Became monopolist", check: b => b.daysCompleted.includes(9) },
      { id: "lerner-master",  label: "🧮 Half-pass-through nailed", check: b => b.daysCompleted.includes(10) },
      { id: "bankruptcy",     label: "💸 Recovered from bankruptcy", check: b => (b.loansTaken + b.hellLoansTaken) >= 1 },
      { id: "graduate",       label: "🎓 Master Baker certification", check: b => b.graduated },
      { id: "perfect-day",    label: "💯 Aced a day (≥95%)", check: (b, last) => last && last.repDelta >= 0.25 },
      { id: "streak-3",       label: "🔥 3-day excellence streak", check: b => computeStreak(b) >= 3 },
      { id: "hell-survivor",  label: "👹 Survived Hell Day 1", check: b => b.hellDaysCompleted.includes(1) },
      { id: "duopoly-master", label: "♟️ Aced Cournot night", check: b => b.hellDaysCompleted.includes(10) },
      { id: "hell-master",    label: "🔱 Hell Market certification", check: b => b.hellGraduated },
      { id: "apoc-survivor",  label: "🌑 Survived the Doomsday Edict", check: b => (b.apocalypseDaysCompleted||[]).includes(1) },
      { id: "apoc-master",    label: "🔮 Beyond Hell Master", check: b => b.apocalypseGraduated },
      { id: "perfect-100",    label: "💯 Royal Examiner — 100/100 predicted",
        check: b => b.apocalypseGraduated && (() => {
          const last4 = (b.apocalypseLog||[]).slice(0,4);
          if (last4.length < 4) return false;
          const avg = last4.reduce((s,e) => s + ((e.phaseScores||[]).reduce((a,x)=>a+x,0)/Math.max(1,(e.phaseScores||[]).length)), 0)/4;
          return avg >= 95;
        })() },
    ];

    function computeStreak(b) {
      let streak = 0;
      const log = MODE === "apocalypse" ? (b.apocalypseLog || []) : MODE === "hell" ? (b.hellLog || []) : (b.log || []);
      for (const e of log) {
        if (e.repDelta > 0) streak += 1;
        else break;
      }
      return streak;
    }

    function toast(message, kind = "win", headline = "") {
      const host = document.getElementById("toast-host");
      const el = document.createElement("div");
      el.className = "toast " + kind;
      el.innerHTML = `${headline ? `<div class="head">${headline}</div>` : ""}<div>${message}</div>`;
      host.appendChild(el);
      setTimeout(() => {
        el.style.animation = "toastOut 0.35s forwards";
        setTimeout(() => el.remove(), 360);
      }, 4500);
    }

    // Wire cheats engine to use our toast for discovery notifications
    window.cheatsToast = (cheat) => {
      toast(`<strong>${cheat.icon} ${cheat.title}</strong><br><small>${cheat.discoveryLine}</small><br><a href="vault.html" style="color:var(--accent); text-decoration: underline;">Open the Vault →</a>`, "win", "📜 Cheat discovered");
    };

    // ---- accessors that route based on mode ----
    function currentDay(b)  { return MODE === "apocalypse" ? b.apocalypseDay : MODE === "hell" ? b.hellDay : b.day; }
    function isGraduated(b) { return MODE === "apocalypse" ? b.apocalypseGraduated : MODE === "hell" ? b.hellGraduated : b.graduated; }
    function currentCash(b) { return MODE === "apocalypse" ? b.apocalypseCash : MODE === "hell" ? b.hellCash : b.cash; }
    function currentRep(b)  { return MODE === "apocalypse" ? b.apocalypseReputation : MODE === "hell" ? b.hellReputation : b.reputation; }
    function currentDays(b) { return MODE === "apocalypse" ? (b.apocalypseDaysCompleted||[]) : MODE === "hell" ? b.hellDaysCompleted : b.daysCompleted; }
    function currentLog(b)  { return MODE === "apocalypse" ? (b.apocalypseLog||[]) : MODE === "hell" ? b.hellLog : b.log; }
    function loanCount(b)   { return MODE === "apocalypse" ? b.apocalypseLoansTaken : MODE === "hell" ? b.hellLoansTaken : b.loansTaken; }
    function takeLoan()     { return MODE === "apocalypse" ? State.takeApocalypseLoan(200) : MODE === "hell" ? State.takeHellLoan(100) : State.takeLoan(50); }

    function renderHeader(b) {
      const root = document.querySelector("header.topbar");
      const title = MODE === "apocalypse" ? "🔮 Beyond Hell: Apocalypse" : MODE === "hell" ? "🔱 Surviving Hell Market" : "🏪 Master Baker";
      const crumbs = isGraduated(b) ? "Certified — Royal Examination awaits" : `Day ${currentDay(b)} of ${TOTAL_DAYS}`;
      root.innerHTML = `
        <div>
          <h1>${title}</h1>
          <div class="crumbs">${crumbs}</div>
        </div>
        <a class="home" href="../index.html">← Map</a>
      `;
    }

    function renderProgress(b) {
      const track = document.getElementById("progress");
      track.className = "progress-track" + (MODE === "apocalypse" ? " apocalypse" : MODE === "hell" ? " hell" : "");
      track.style.gridTemplateColumns = `repeat(${TOTAL_DAYS}, 1fr)`;
      track.innerHTML = "";
      for (let i = 1; i <= TOTAL_DAYS; i++) {
        const pip = document.createElement("div");
        let cls = "pip";
        if (currentDays(b).includes(i)) cls += " done";
        else if (i === currentDay(b) && !isGraduated(b)) cls += " current";
        pip.className = cls;
        pip.title = `Day ${i}` + (currentDays(b).includes(i) ? " ✓" : "");
        track.appendChild(pip);
      }
    }

    function renderScene(b) {
      const day = DAY_GETTER(isGraduated(b) ? TOTAL_DAYS : currentDay(b));
      const w = day?.weather || { emoji: "🌙", line: "Quiet night." };
      const streak = computeStreak(b);
      document.getElementById("scene").innerHTML = `
        <div class="weather">${w.emoji}</div>
        <div class="scene-text"><span class="accent">${day?.title || "Closed."}</span><br>${w.line}</div>
        <div class="streak">🔥 streak ${streak}</div>
      `;
    }

    function renderDashboard(b) {
      const earnedAch = ACHIEVEMENTS.filter(a => b.achievements.includes(a.id)).length;
      const tech = currentTech(b);
      const modeBadge = MODE === "apocalypse" ? "🔮 Apocalypse" : MODE === "hell" ? "🔱 Hell" : "🏪 Vanilla";
      document.getElementById("dashboard").innerHTML = `
        <div class="kpi"><span class="label">Mode</span><span class="value">${modeBadge}</span></div>
        <div class="kpi"><span class="label">Day</span><span class="value">${currentDay(b)}/${TOTAL_DAYS}</span></div>
        <div class="kpi"><span class="label">💰 Cash</span><span class="value ${currentCash(b) < 0 ? "bad" : currentCash(b) > 300 ? "good" : ""}">${currentCash(b).toFixed(0)}</span></div>
        <div class="kpi"><span class="label">⭐ Rep</span><span class="value">${currentRep(b).toFixed(1)}/5</span></div>
        ${tech ? `<div class="kpi"><span class="label">${tech.emoji} Tech</span><span class="value" style="font-size:0.95em;">${tech.name}</span></div>` : ""}
        <div class="kpi"><span class="label">🏆 Badges</span><span class="value">${earnedAch}/${ACHIEVEMENTS.length}</span></div>
      `;
    }

    function refLink(chapterId) {
      const map = {
        0: "0-bakery-preparation.html",
        1: "1-market-day.html",
        2: "2-sugar-tax.html",
        3: "3-tariffs.html",
        4: "4-oven-smoke.html",
        5: "5-lemon-loaves.html",
        6: "6-monopoly.html",
      };
      return map[chapterId] || "../index.html";
    }

    function typesetMath(target = document.body) {
      if (!window.renderMathInElement) return;
      try {
        window.renderMathInElement(target, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
          errorColor: "#e08c6e",
        });
      } catch (e) { console.warn("KaTeX:", e); }
    }

    // ============== VANILLA RENDERER (unchanged from previous) ==============
    function renderDayVanilla(b) {
      const host = document.getElementById("day-host");
      host.innerHTML = "";

      if (b.graduated) {
        host.innerHTML = `
          <div class="consequence-banner win" style="text-align:center; font-size:1.05em;">
            🎓 <strong>Congratulations, Master Baker.</strong><br>
            You survived 10 days. Hell Market is now unlocked.
            <p style="margin-top:14px;">
              <a class="bigbtn" style="display:inline-block;" href="final-mock.html">🏛️ Take the Royal Exam →</a>
              <a class="bigbtn" style="display:inline-block; background: linear-gradient(180deg,#7a2424,#3a1010); border-color:#5a1a1a; color:#fde6c0;" href="daily.html?mode=hell">🔱 Enter Hell Market →</a>
            </p>
            <p><small><button class="ghost small" id="restart-btn">Restart Vanilla campaign</button></small></p>
          </div>
        `;
        document.getElementById("restart-btn")?.addEventListener("click", () => {
          if (confirm("Restart the Vanilla campaign? (Chapter scores and Hell progress preserved.)")) {
            State.resetBakery();
            location.reload();
          }
        });
        return;
      }

      const day = getDay(b.day);
      if (!day) { host.innerHTML = `<div class="card">No data for Day ${b.day}.</div>`; return; }

      const letter = day.letter(b.tech);

      host.innerHTML = `
        <h2 style="margin-top:18px;">Day ${day.day} — ${day.title}</h2>
        <div class="letter">
          <div class="from">${letter.from}</div>
          <div class="body">${letter.body}</div>
        </div>
        <div class="card">
          <h3>Your decision</h3>
          <p style="font-size:0.92em; color:var(--ink-soft); margin-top:-4px;">Fill each field, then press <strong>Enter</strong> or click Send.</p>
          ${day.fields.map((f, i) => `
            <div class="field-row">
              <div>
                <label for="f-${f.id}">${f.label}</label>
                <span class="hint-text">tolerance ±${f.tol}${f.hint ? ` · 🐾 ${f.hint}` : ""}</span>
              </div>
              <input id="f-${f.id}" type="number" step="0.01" class="cell" placeholder="number" inputmode="decimal" ${i === 0 ? "autofocus" : ""}>
            </div>
          `).join("")}
          <button id="submit" class="bigbtn">📤 Send my answer →</button>
          <p style="font-size:0.85em; color:var(--muted); margin-top:12px; text-align:center;">
            Stuck? <a target="_blank" rel="noopener" href="${refLink(day.chapterRef.id)}">📚 ${day.chapterRef.label}</a>
          </p>
        </div>
        <div id="consequence"></div>
      `;

      const btn = document.getElementById("submit");
      btn.addEventListener("click", () => submitVanilla(day, letter));
      document.querySelectorAll(".field-row input").forEach(inp => {
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitVanilla(day, letter); } });
      });
      const first = document.querySelector(".field-row input");
      if (first) setTimeout(() => first.focus(), 100);
      typesetMath();
    }

    function submitVanilla(day, letter) {
      const answers = {};
      const missing = [];
      day.fields.forEach(f => {
        const el = document.getElementById("f-" + f.id);
        const v = parseFloat(el.value);
        answers[f.id] = v;
        if (!isFinite(v)) { missing.push(f.label); el.classList.add("wrong"); }
        else el.classList.remove("wrong");
      });
      if (missing.length) {
        const c = document.getElementById("consequence");
        c.innerHTML = `<div class="consequence-banner fail">⚠️ Please fill in: <strong>${missing.join(", ")}</strong>.</div>`;
        c.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      const result = day.grade(letter, answers);

      const queue = buildQueue(day);
      const queueHTML = queue.map(q => `
        <div class="queue-row">
          <div class="portrait">${q.cat.emoji}</div>
          <div>
            <div class="name">${q.cat.name}</div>
            <div class="reason">${q.result.reason || q.cat.blurb}</div>
            <div class="bubble">"${flavorLine(q.result.satisfied)}"</div>
          </div>
          <div class="verdict">${q.result.satisfied ? "😺" : "😾"}</div>
        </div>
      `).join("");

      State.applyDayResult({
        day: day.day, title: day.title, yourAnswer: answers,
        correctAnswer: result.targets, cashDelta: result.cashDelta,
        repDelta: result.repDelta, summary: result.summary,
      });

      // Cheat discovery: Vanilla day completion emits a "day" context
      tryUnlockCheats({ trigger: "day", mode: "vanilla", day: day.day, score: result.score });
      // Essay walkthroughs surface inside their chapters, not here; but Day 4 vanilla
      // does a price-ceiling, and Day 6 does the tariff variant — emit those too.
      if (day.day === 4 && result.score >= 50) tryUnlockCheats({ trigger: "essay1", score: result.score, mode: "vanilla" });
      if (day.day === 6 && result.score >= 50) tryUnlockCheats({ trigger: "essay2", score: result.score, mode: "vanilla" });

      const newState = State.bakery();
      ACHIEVEMENTS.forEach(a => {
        if (!newState.achievements.includes(a.id) && a.check(newState, newState.log[0])) {
          if (State.awardAchievement(a.id)) toast(a.label, "win", "🏆 Achievement!");
        }
      });

      const finalState = State.bakery();
      const bankrupt = finalState.cash < 0;
      const cls = result.score >= 80 ? "win" : result.score >= 50 ? "" : "fail";
      const verdict = result.score >= 80 ? "Excellent." : result.score >= 50 ? "Workable." : "Painful.";

      const c = document.getElementById("consequence");
      c.innerHTML = `
        <div class="consequence-banner ${cls}">
          <strong>${verdict}</strong> Score: ${Math.round(result.score)}/100 · Cash ${result.cashDelta >= 0 ? "+" : ""}${result.cashDelta} · Rep ${result.repDelta >= 0 ? "+" : ""}${result.repDelta.toFixed(1)} ⭐
        </div>
        <div class="card">
          <h3>What actually happened</h3>
          <p>${result.summary}</p>
          ${queueHTML.length ? `<h4 style="margin-top:14px">The day's customers</h4>${queueHTML}` : ""}
        </div>
        ${bankrupt ? `<div class="consequence-banner fail" style="text-align:center">💸 Bankrupt. <button id="loan-btn">Take 50-coin loan</button></div>` : ""}
        ${day.day === 10 ? `
          <div class="consequence-banner win" style="text-align:center; margin-top:16px;">
            🎓 Campaign complete! Royal Exam unlocked. 🔱 Hell Market unlocked.
            <p style="margin-top:8px;">
              <a class="bigbtn" style="display:inline-block;" href="final-mock.html">Take the Royal Exam →</a>
              <a class="bigbtn" style="display:inline-block; background: linear-gradient(180deg,#7a2424,#3a1010); border-color:#5a1a1a; color:#fde6c0;" href="daily.html?mode=hell">Enter Hell Market →</a>
            </p>
          </div>
        ` : `
          <p style="text-align:center; margin-top:18px;">
            <button id="sleep" class="bigbtn" style="max-width:320px; margin:0 auto;">🌙 Sleep until Day ${day.day + 1} →</button>
          </p>
        `}
      `;

      const sbtn = document.getElementById("submit"); if (sbtn) sbtn.disabled = true;
      document.getElementById("sleep")?.addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); render(); });
      document.getElementById("loan-btn")?.addEventListener("click", () => { State.takeLoan(50); render(); });

      renderHeader(finalState); renderDashboard(finalState); renderProgress(finalState); renderScene(finalState); renderLogbook(finalState); renderAchievements(finalState);
      typesetMath();
      c.scrollIntoView({ behavior: "smooth", block: "start" });
      if (result.score >= 90) toast("Cats purring 🐾", "win", `Day ${day.day} mastered`);
      else if (result.score < 40) toast("Reputation hit. Reference open?", "bad", `Day ${day.day} rough`);
    }

    // ============== HELL RENDERER (phased) ==============
    function renderDayHell(b) {
      const host = document.getElementById("day-host");
      host.innerHTML = "";

      if (b.hellGraduated) {
        host.innerHTML = `
          <div class="consequence-banner win" style="text-align:center; font-size:1.05em;">
            🔱 <strong>You have survived Hell Market.</strong><br>
            Master Baker of the deep economics. The exam holds no terrors for you now.
            <p style="margin-top:14px;">
              <a class="bigbtn" style="display:inline-block;" href="final-mock.html">🏛️ Take the Royal Exam →</a>
              <button class="ghost small" id="hell-restart">Restart Hell campaign</button>
            </p>
          </div>
        `;
        document.getElementById("hell-restart")?.addEventListener("click", () => {
          if (confirm("Restart Hell Market? (Vanilla & chapter progress preserved.)")) {
            State.resetHell(); location.reload();
          }
        });
        return;
      }

      const day = getHellDay(b.hellDay);
      if (!day) { host.innerHTML = `<div class="card">No data for Hell Day ${b.hellDay}.</div>`; return; }

      // Resume from in-progress, or start fresh
      const progress = (b.hellInProgress && b.hellInProgress.day === day.day)
        ? b.hellInProgress
        : { day: day.day, phaseIdx: 0, phaseResults: [] };

      renderHellPhase(b, day, progress);
    }

    function renderHellPhase(b, day, progress) {
      const host = document.getElementById("day-host");
      const phaseIdx = progress.phaseIdx;
      const phase = day.phases[phaseIdx];
      const letter = day.letter(b.hellTech);
      const totalPhases = day.phases.length;
      const completedScores = progress.phaseResults.map(r => r.score);

      host.innerHTML = `
        <h2 style="margin-top:18px;">🔱 Hell Day ${day.day} — ${day.title}</h2>
        <div class="phase-chip-row">
          ${day.phases.map((p, i) => `
            <span class="phase-chip ${i < phaseIdx ? "done" : i === phaseIdx ? "active" : ""}">
              ${i < phaseIdx ? `✓ ${Math.round(completedScores[i] || 0)}` : i === phaseIdx ? "▶" : "○"}&nbsp;${p.title.split("—")[0].trim()}
            </span>
          `).join("")}
        </div>
        ${phaseIdx === 0 ? `
          <div class="letter">
            <div class="from">${letter.from}</div>
            <div class="body">${letter.body}</div>
          </div>
        ` : `
          <details class="letter-collapsed">
            <summary>📜 Problem setup — <em>${letter.from}</em> &nbsp;(click to re-read)</summary>
            <div class="letter">
              <div class="from">${letter.from}</div>
              <div class="body">${letter.body}</div>
            </div>
          </details>
        `}
        <div class="card">
          <h3>${phase.title}</h3>
          ${phase.narrative ? `<p style="color:var(--ink-soft); font-style:italic;">${phase.narrative}</p>` : ""}
          ${phase.fields.map((f, i) => `
            <div class="field-row">
              <div>
                <label for="hf-${f.id}">${f.label}</label>
                <span class="hint-text">tolerance ±${f.tol}${f.hint ? ` · 🐾 ${f.hint}` : ""}</span>
              </div>
              <input id="hf-${f.id}" type="number" step="0.0001" class="cell" placeholder="number" inputmode="decimal" ${i === 0 ? "autofocus" : ""}>
            </div>
          `).join("")}
          <button id="hsubmit" class="bigbtn">📤 Send Phase ${phaseIdx + 1} →</button>
          <p style="font-size:0.85em; color:var(--muted); margin-top:12px; text-align:center;">
            Stuck? <a target="_blank" rel="noopener" href="${refLink(day.chapterRef.id)}">📚 ${day.chapterRef.label}</a>
          </p>
        </div>
        <div id="consequence"></div>
      `;

      const btn = document.getElementById("hsubmit");
      btn.addEventListener("click", () => submitHellPhase(b, day, progress, letter));
      document.querySelectorAll(".field-row input").forEach(inp => {
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitHellPhase(b, day, progress, letter); } });
      });
      const first = document.querySelector(".field-row input");
      if (first) setTimeout(() => first.focus(), 100);
      typesetMath();
    }

    function submitHellPhase(b, day, progress, letter) {
      const phase = day.phases[progress.phaseIdx];
      const answers = {};
      const missing = [];
      phase.fields.forEach(f => {
        const el = document.getElementById("hf-" + f.id);
        const v = parseFloat(el.value);
        answers[f.id] = v;
        if (!isFinite(v)) { missing.push(f.label); el.classList.add("wrong"); }
        else el.classList.remove("wrong");
      });
      if (missing.length) {
        const c = document.getElementById("consequence");
        c.innerHTML = `<div class="consequence-banner fail">⚠️ Fill: <strong>${missing.join(", ")}</strong>.</div>`;
        c.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      const prior = progress.phaseResults.map(r => r.targets);
      const graded = phase.grade(letter, answers, prior);
      const score = graded.scoreEach(answers);

      progress.phaseResults.push({ key: phase.key, score, targets: graded.targets, summary: graded.summary, answers });
      progress.phaseIdx += 1;
      State.saveHellProgress(progress);

      // Cheat discovery: Hell phase context
      tryUnlockCheats({ trigger: "hell-phase", mode: "hell", day: day.day, phaseIdx: progress.phaseIdx - 1, score });

      const isLast = progress.phaseIdx >= day.phases.length;
      const cls = score >= 80 ? "win" : score >= 50 ? "" : "fail";
      const verdict = score >= 80 ? "Phase aced." : score >= 50 ? "Phase passed." : "Painful phase.";

      const c = document.getElementById("consequence");
      c.innerHTML = `
        <div class="consequence-banner ${cls}">
          <strong>${verdict}</strong> Phase score: ${Math.round(score)}/100
        </div>
        <div class="card">
          <h3>What the books say</h3>
          <p>${graded.summary}</p>
        </div>
        <p style="text-align:center; margin-top:18px;">
          ${isLast
            ? `<button id="finalize" class="bigbtn" style="max-width:340px; margin:0 auto;">🌙 Close the day & sleep →</button>`
            : `<button id="next-phase" class="bigbtn" style="max-width:340px; margin:0 auto;">▶ Continue to Phase ${progress.phaseIdx + 1} →</button>`
          }
        </p>
      `;

      const sbtn = document.getElementById("hsubmit"); if (sbtn) sbtn.disabled = true;

      if (isLast) {
        document.getElementById("finalize").addEventListener("click", () => finalizeHellDay(day, progress));
      } else {
        document.getElementById("next-phase").addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
          renderHellPhase(State.bakery(), day, progress);
        });
      }
      typesetMath();
      c.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function finalizeHellDay(day, progress) {
      // Aggregate: avg score across phases → cash/rep deltas
      const scores = progress.phaseResults.map(r => r.score);
      const avg = scores.reduce((s, x) => s + x, 0) / scores.length;
      const cashDelta = Math.round((avg - 50) * 1.2);  // -60 .. +60 typical
      const repDelta = avg >= 90 ? 0.35 : avg >= 70 ? 0.15 : avg >= 50 ? 0 : -0.3;

      const summary = `Phases avg: ${avg.toFixed(0)}/100. ${progress.phaseResults.map((r, i) => `Phase ${i+1}: ${Math.round(r.score)}`).join(" · ")}`;

      State.applyHellDayResult({
        day: day.day,
        title: day.title,
        cashDelta,
        repDelta,
        summary,
        phaseScores: scores,
      });

      const newState = State.bakery();
      ACHIEVEMENTS.forEach(a => {
        if (!newState.achievements.includes(a.id) && a.check(newState, newState.hellLog[0])) {
          if (State.awardAchievement(a.id)) toast(a.label, "win", "🏆 Achievement!");
        }
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
      render();

      if (avg >= 90) toast("Hell day mastered.", "win", `Hell Day ${day.day} ✓`);
      else if (avg < 40) toast("Hell hurts. Open a notebook.", "bad", `Hell Day ${day.day}`);
    }

    // ============== APOCALYPSE RENDERER (phased + timed + scrolls + choices + MCQ blitz) ==============
    let apocTimerHandle = null;
    function clearApocTimer() { if (apocTimerHandle) { clearInterval(apocTimerHandle); apocTimerHandle = null; } }

    function renderDayApocalypse(b) {
      const host = document.getElementById("day-host");
      host.innerHTML = "";
      clearApocTimer();

      if (b.apocalypseGraduated) {
        host.innerHTML = `
          <div class="consequence-banner win" style="text-align:center; font-size:1.05em;">
            🔮 <strong>You are now a Master Examiner.</strong><br>
            All sixteen days survived. The Royal Examination Bureau has signed your certificate.
            <p style="margin-top:14px;">
              <a class="bigbtn" style="display:inline-block;" href="final-mock.html">🏛️ Take the Royal Exam (one more time, for record) →</a>
            </p>
            <p><small><button class="ghost small" id="apoc-restart">Restart Apocalypse campaign</button></small></p>
          </div>

      }

      if (day.isBlitz) { renderApocBlitz(b, day, progress); return; }

    function renderApocPhase(b, day, progress) {
      const host = document.getElementById("day-host");
      const phaseIdx = progress.phaseIdx;
      const phase = day.phases[phaseIdx];
      const letter = day.letter();
      const completedScores = progress.phaseResults.map(r => r.score);

      // arc scroll (only at start of arc day, only on Phase 0)
      const scroll = (day.arcScroll && phaseIdx === 0) ? ARC_SCROLLS[day.day] : null;

      // memory callback (only on Phase 0)
      let memory = null;
      if (phaseIdx === 0 && MEMORY_TEMPLATES[day.day]) {
        const log = b.apocalypseLog || [];
        const scoreByDay = {};
        log.forEach(e => {
          const avg = (e.phaseScores||[]).reduce((s,x)=>s+x,0) / Math.max(1, (e.phaseScores||[]).length);
          scoreByDay[e.day] = avg;
        });
        const allScores = Object.values(scoreByDay);
        const overallAvg = allScores.length ? allScores.reduce((s,x)=>s+x,0)/allScores.length : null;
        const lowestEntry = Object.entries(scoreByDay).sort((a,b)=>a[1]-b[1])[0];
        const ctx = {
          d2score: scoreByDay[2], d4score: scoreByDay[4],
          d6score: scoreByDay[6], d9score: scoreByDay[9],
          avg: overallAvg,
          lowestDay: lowestEntry ? +lowestEntry[0] : null,
          lowestScore: lowestEntry ? lowestEntry[1] : null,
        };
        memory = MEMORY_TEMPLATES[day.day](ctx);
      }

      // NPC interjection (random one for this day, on Phase 0)
      let npc = null;
      if (phaseIdx === 0 && NPC_INTERJECTIONS[day.day]) {
        const opts = NPC_INTERJECTIONS[day.day];
        npc = opts[Math.floor(Math.random() * opts.length)];
      }

      const isChoice = phase.type === "choice";
      const timeBudget = phase.timeSec || 90;

      host.innerHTML = `
        <h2 style="margin-top:18px;">🔮 Apocalypse Day ${day.day} — ${day.title}</h2>

        ${scroll ? `
          <div class="arc-scroll">
            <div class="arc-cinematic">${scroll.cinematic}</div>
            <h3 style="margin-top:0; color:var(--accent);">${scroll.title}</h3>
            ${scroll.body}
          </div>
        ` : ""}

        <div class="phase-chip-row">
          ${day.phases.map((p, i) => `
            <span class="phase-chip ${i < phaseIdx ? "done" : i === phaseIdx ? "active" : ""}">
              ${i < phaseIdx ? `✓ ${Math.round(completedScores[i] || 0)}` : i === phaseIdx ? "▶" : "○"}&nbsp;${p.title.split("—")[0].trim()}
            </span>
          `).join("")}
        </div>

        ${phaseIdx === 0 ? `
          <div class="letter">
            <div class="from">${letter.from}</div>
            <div class="body">${letter.body}</div>
          </div>
        ` : `
          <details class="letter-collapsed">
            <summary>📜 Problem setup — <em>${letter.from}</em> &nbsp;(click to re-read)</summary>
            <div class="letter">
              <div class="from">${letter.from}</div>
              <div class="body">${letter.body}</div>
            </div>
          </details>
        `}

        ${memory ? `<div class="memory-callback">📖 ${memory}</div>` : ""}
        ${npc ? `<div class="bubble" style="display:block; max-width:600px; margin:10px 0; padding:10px 14px; font-size:0.95em;">${npc.who}: <em>"${npc.line}"</em></div>` : ""}

        <div class="card">
          <h3>${phase.title}</h3>
          <div class="phase-timer" id="phase-timer">⏱️ ${Math.floor(timeBudget/60)}:${(timeBudget%60).toString().padStart(2,"0")} target</div>
          ${phase.narrative ? `<p style="color:var(--ink-soft); font-style:italic;">${phase.narrative}</p>` : ""}
          ${isChoice ? `
            <div class="choice-options">
              ${phase.fields[0].options.map((opt, i) => `
                <label class="choice-option">
                  <input type="radio" name="apoc-choice" value="${i}">
                  <span>${opt}</span>
                </label>
              `).join("")}
            </div>
          ` : `
            ${phase.fields.map((f, i) => `
              <div class="field-row">
                <div>
                  <label for="af-${f.id}">${f.label}</label>
                  <span class="hint-text">tolerance ±${f.tol}${f.hint ? ` · 🐾 ${f.hint}` : ""}</span>
                </div>
                <input id="af-${f.id}" type="number" step="0.0001" class="cell" placeholder="number" inputmode="decimal" ${i === 0 ? "autofocus" : ""}>
              </div>
            `).join("")}
          `}
          <button id="asubmit" class="bigbtn">📤 Send Phase ${phaseIdx + 1} →</button>
        </div>
        <div id="consequence"></div>
      `;

      // Wire submit + Enter-to-submit
      const submitFn = () => submitApocPhase(b, day, progress, letter, phase);
      document.getElementById("asubmit").addEventListener("click", submitFn);
      if (isChoice) {
        document.querySelectorAll('input[name="apoc-choice"]').forEach(el => {
          el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submitFn(); } });
        });
      } else {
        document.querySelectorAll(".field-row input").forEach(inp => {
          inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitFn(); } });
        });
        const first = document.querySelector(".field-row input");
        if (first) setTimeout(() => first.focus(), 100);
      }

      // Start the soft per-phase timer
      let remaining = timeBudget;
      const timerEl = document.getElementById("phase-timer");
      apocTimerHandle = setInterval(() => {
        remaining -= 1;
        const sign = remaining < 0 ? "−" : "";
        const abs = Math.abs(remaining);
        const m = Math.floor(abs / 60).toString().padStart(2,"0");
        const s = (abs % 60).toString().padStart(2,"0");
        timerEl.textContent = `⏱️ ${sign}${m}:${s}${remaining < 0 ? " (over budget, rep -0.1/30s)" : ""}`;
        if (remaining <= 10 && remaining > 0) timerEl.classList.add("warn");
        if (remaining <= 0) {
          timerEl.classList.remove("warn");
          timerEl.classList.add("crit");
          if (remaining % 30 === 0) {
            progress.lateRepLoss = (progress.lateRepLoss || 0) + 0.1;
          }
        }
      }, 1000);

      typesetMath();
    }

    function submitApocPhase(b, day, progress, letter, phase) {
      clearApocTimer();
      const isChoice = phase.type === "choice";
      const answers = {};
      const missing = [];

      if (isChoice) {
        const picked = document.querySelector('input[name="apoc-choice"]:checked');
        if (!picked) {
          const c = document.getElementById("consequence");
          c.innerHTML = `<div class="consequence-banner fail">⚠️ Pick an option, then send.</div>`;
          // restart timer for the player
          renderApocPhase(b, day, progress);
          return;
        }
        answers[phase.fields[0].id] = parseInt(picked.value, 10);
      } else {
        phase.fields.forEach(f => {
          const el = document.getElementById("af-" + f.id);
          const v = parseFloat(el.value);
          answers[f.id] = v;
          if (!isFinite(v)) { missing.push(f.label); el.classList.add("wrong"); }
          else el.classList.remove("wrong");
        });
        if (missing.length) {
          const c = document.getElementById("consequence");
          c.innerHTML = `<div class="consequence-banner fail">⚠️ Fill: <strong>${missing.join(", ")}</strong>.</div>`;
          renderApocPhase(b, day, progress);   // re-render to restart the timer
          return;
        }
      }

      const prior = progress.phaseResults.map(r => r.targets);
      const graded = phase.grade(letter, answers, prior);
      const score = graded.scoreEach(answers);

      progress.phaseResults.push({ key: phase.key, score, targets: graded.targets, summary: graded.summary, answers });
      progress.phaseIdx += 1;
      State.saveApocalypseProgress(progress);

      // Cheat discovery: Apocalypse phase context
      tryUnlockCheats({ trigger: "apoc-phase", mode: "apocalypse", day: day.day, phaseIdx: progress.phaseIdx - 1, score });
      // Day 13 = Essay 1 boss; Day 14 = Essay 2 boss — also emit essay context per phase
      if (day.day === 13) tryUnlockCheats({ trigger: "essay1", score, mode: "apocalypse" });
      if (day.day === 14) tryUnlockCheats({ trigger: "essay2", score, mode: "apocalypse" });

      const isLast = progress.phaseIdx >= day.phases.length;
      const cls = score >= 80 ? "win" : score >= 50 ? "" : "fail";
      const verdict = score >= 80 ? "Phase aced." : score >= 50 ? "Phase passed." : "Phase missed.";

      const c = document.getElementById("consequence");
      c.innerHTML = `
        <div class="consequence-banner ${cls}">
          <strong>${verdict}</strong> Phase score: ${Math.round(score)}/100
          ${progress.lateRepLoss ? ` · ⏱️ overtime rep loss so far: -${progress.lateRepLoss.toFixed(1)}` : ""}

            ? `<button id="afinalize" class="bigbtn" style="max-width:340px; margin:0 auto;">🌙 Close the day & sleep →</button>`
            : `<button id="anext" class="bigbtn" style="max-width:340px; margin:0 auto;">▶ Continue to Phase ${progress.phaseIdx + 1} →</button>`
          }
        </p>
      `;
      const sbtn = document.getElementById("asubmit"); if (sbtn) sbtn.disabled = true;

      if (isLast) document.getElementById("afinalize").addEventListener("click", () => finalizeApocDay(day, progress));
      else document.getElementById("anext").addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
        renderApocPhase(State.bakery(), day, progress);
      });
      typesetMath();
      c.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function finalizeApocDay(day, progress) {
      const scores = progress.phaseResults.map(r => r.score);
      const avgScore = scores.reduce((s, x) => s + x, 0) / Math.max(1, scores.length);
      const cashDelta = Math.round((avgScore - 50) * 1.5);
      let repDelta = avgScore >= 90 ? 0.4 : avgScore >= 70 ? 0.2 : avgScore >= 50 ? 0 : -0.35;
      repDelta -= (progress.lateRepLoss || 0);

      const summary = `Phases avg: ${avgScore.toFixed(0)}/100. ${progress.phaseResults.map((r, i) => `Phase ${i+1}: ${Math.round(r.score)}`).join(" · ")}${progress.lateRepLoss ? ` · overtime -${progress.lateRepLoss.toFixed(1)}` : ""}`;

      State.applyApocalypseDayResult({
        day: day.day, title: day.title, cashDelta, repDelta, summary,
        phaseScores: scores,
      });

      // Cheat discovery: Apocalypse day completion (carries the avg)
      tryUnlockCheats({ trigger: "apoc-day-complete", mode: "apocalypse", day: day.day, avgScore });

      const newState = State.bakery();
      ACHIEVEMENTS.forEach(a => {
        if (!newState.achievements.includes(a.id) && a.check(newState, newState.apocalypseLog[0])) {

    function finalizeBlitz(day) {

      const summary = `MCQ blitz: ${numCorrect}/${FINAL_MOCK.length} correct (${blitzScore}/100).`;

      State.applyApocalypseDayResult({

      const newState = State.bakery();
      ACHIEVEMENTS.forEach(a => {

        }
      });

      const result = document.getElementById("blitz-result");
      result.innerHTML = `

        <p style="text-align:center; margin-top:18px;">
          <button id="blitz-next" class="bigbtn" style="max-width:340px; margin:0 auto;">🌙 Sleep until Day ${day.day + 1} →</button>
        </p>
      `;
      typesetMath();
      result.scrollIntoView({ behavior: "smooth", block: "start" });
      blitzState = null; // clear so a replay restarts cleanly
      document.getElementById("blitz-next").addEventListener("click", () => { window.scrollTo({top:0}); render(); });
    }

    function buildQueue(day) {
      const rosters = {
        1: ["penny", "engineer"], 2: ["penny", "tim"], 3: ["penny", "engineer", "tim"],
        4: ["penny", "engineer", "inspector"], 5: ["penny", "pawley", "furrington"],
        6: ["penny", "cream", "engineer"], 7: ["penny", "inspector"],
        8: ["inspector", "cream", "penny"], 9: ["penny", "pawley", "engineer", "tim"],
        10: ["penny", "pawley", "cream", "engineer"],
      };
      const ids = rosters[day.day] || ["penny"];
      const prices = { loaf: 3, baguette: 4, croissant: 8, cake: 12, cupcake: 5 };
      return ids.map(id => ({ cat: CATS[id], result: purchase(CATS[id], prices, day.day < 8) }));
    }

    function renderLogbook(b) {
      const host = document.getElementById("logbook");
      const log = currentLog(b);
      if (!log.length) {
        host.innerHTML = `<p style="color:var(--ink-soft); font-style:italic;">No entries yet.</p>`;
        return;
      }
      host.innerHTML = log.map(e => `
        <div class="logbook-entry ${e.cashDelta >= 0 ? "win" : "fail"}">
          <div class="day">Day ${e.day} — ${e.title}</div>
          <div class="summary">${e.summary}</div>
          <div class="summary">Cash ${e.cashDelta >= 0 ? "+" : ""}${e.cashDelta} · Rep ${e.repDelta >= 0 ? "+" : ""}${e.repDelta.toFixed(1)}</div>
        </div>
      `).join("");
      typesetMath();
    }

    function renderAchievements(b) {
      const host = document.getElementById("ach");
      host.innerHTML = ACHIEVEMENTS.map(a => `
        <span class="achievement ${b.achievements.includes(a.id) ? "" : "locked"}">${a.label}</span>
      `).join("");
    }

    function currentTech(b) {
      const id = MODE === "hell" ? b.hellTech : b.tech;
      return id ? getTech(id) : null;
    }

    function renderSlotMachine() {
      const host = document.getElementById("day-host");
      const introCopy = MODE === "hell"
        ? "Hell Market does not care which father you had — it cares only which technology you inherit. Spin to discover yours. The result is locked until you graduate or reset Hell."
        : "Family rumour: you may not be Old Tomcat's true heir. Four fathers, four bakeries, four production technologies. Spin the family tree. Whichever cat you actually inherit from is who you are for the next 10 days.";

      host.innerHTML = `
        <div class="card story" style="text-align:center;">
          <h2 style="margin-top:0;">🎰 Roll the Family Tree</h2>
          <p style="color:var(--ink-soft);">${introCopy}</p>
          <div class="slot-row" id="slot-row">
            <div class="slot-cell" id="slot-1">❓</div>
            <div class="slot-cell" id="slot-2">❓</div>
            <div class="slot-cell" id="slot-3">❓</div>
          </div>
          <div class="slot-caption" id="slot-caption">Press the lever to roll a father.</div>
          <button id="spin-btn" class="bigbtn" style="max-width:300px; margin:18px auto 0;">🎰 Spin the family tree</button>
        </div>
        <div class="card" id="tech-preview" style="display:none"></div>
      `;

      document.getElementById("spin-btn").addEventListener("click", spinSlot);
    }

    let spinning = false;
    function spinSlot() {
      if (spinning) return;
      spinning = true;
      const btn = document.getElementById("spin-btn");
      btn.disabled = true;
      btn.textContent = "🎰 Spinning…";

      const cells = [document.getElementById("slot-1"), document.getElementById("slot-2"), document.getElementById("slot-3")];
      const finalTech = rollTech();
      const final = getTech(finalTech);
      const otherEmojis = TECH_LIST.filter(t => t.id !== finalTech).map(t => t.emoji);

      let ticks = 0;
      const ticker = setInterval(() => {
        cells.forEach(c => {
          const opts = [...otherEmojis, final.emoji, "🎲", "🌪️", "🍞"];
          c.textContent = opts[Math.floor(Math.random() * opts.length)];
          c.classList.add("spinning");
        });
        ticks += 1;
        // Lock cells one by one
        if (ticks >= 8)  cells[0].textContent = final.emoji, cells[0].classList.remove("spinning"), cells[0].classList.add("locked");
        if (ticks >= 12) cells[1].textContent = final.emoji, cells[1].classList.remove("spinning"), cells[1].classList.add("locked");
        if (ticks >= 16) {
          cells[2].textContent = final.emoji; cells[2].classList.remove("spinning"); cells[2].classList.add("locked");
          clearInterval(ticker);
          finishSpin(final);
        }
      }, 120);
    }

    function finishSpin(tech) {
      document.getElementById("slot-caption").innerHTML =
        `🎉 You inherited <strong>${tech.name}</strong>'s bakery!`;
      const preview = document.getElementById("tech-preview");
      preview.style.display = "block";
      preview.innerHTML = `
        <h3>${tech.emoji} ${tech.name}'s technology</h3>
        <p style="color:var(--ink-soft); font-style:italic;">${tech.fatherStory}</p>
        <p>Your short-run production function:</p>
        <p style="text-align:center;">$$${tech.formula}$$</p>
        <p style="font-size:0.9em; color:var(--muted);">${tech.paramHint}.</p>
        <p>First-order condition for profit-max under output price $p$ and wage $w$:</p>
        <p style="text-align:center;">$$${tech.foc}$$</p>
        <p style="text-align:center; margin-top:18px;">
          <button id="lock-tech" class="bigbtn" style="max-width:340px; margin:0 auto;">✅ Lock it in — start Day 1</button>
        </p>
      `;
      typesetMath(preview);
      preview.scrollIntoView({ behavior: "smooth", block: "start" });
      document.getElementById("lock-tech").addEventListener("click", () => {
        State.setTech(MODE, tech.id);
        spinning = false;
        toast(`${tech.emoji} ${tech.name} is now your father.`, "win", "Technology locked");
        window.scrollTo({ top: 0, behavior: "smooth" });
        render();
      });
    }

    function render() {
      try {
        const b = State.bakery();
        // Hell mode requires Vanilla graduation — unless Red Hot Pan is on
        if (MODE === "hell" && !b.graduated && !b.redHotPan) {
          document.getElementById("day-host").innerHTML = `
            <div class="errpanel">
              🔒 <strong>Hell Market is locked.</strong>
              <br><br>Graduate the Vanilla campaign (complete Day 10) before entering.
              <br><br><a class="ghost small" href="daily.html" style="display:inline-block; padding:8px 14px; border-radius:6px; text-decoration:none; background:var(--paper); border:1px solid var(--border); color:var(--accent);">← Return to Vanilla</a>
            </div>`;
          renderHeader(b); renderDashboard(b); renderProgress(b); renderScene(b);
          return;
        }
        // Apocalypse requires Hell graduation — unless Red Hot Pan is on
        if (MODE === "apocalypse" && !b.hellGraduated && !b.redHotPan) {
          document.getElementById("day-host").innerHTML = `
            <div class="errpanel">
              🔒 <strong>Beyond Hell: Apocalypse is locked.</strong>
              <br><br>Graduate Hell Market (complete Day 14) before entering.
              <br><br><a class="ghost small" href="daily.html?mode=hell" style="display:inline-block; padding:8px 14px; border-radius:6px; text-decoration:none; background:var(--paper); border:1px solid var(--border); color:var(--accent);">→ Open Hell Market</a>
            </div>`;
          renderHeader(b); renderDashboard(b); renderProgress(b); renderScene(b);
          return;
        }
        renderHeader(b); renderProgress(b); renderScene(b); renderDashboard(b);
        // Slot machine if no technology rolled for this campaign yet
        const techId = MODE === "apocalypse" ? b.apocalypseTech : MODE === "hell" ? b.hellTech : b.tech;
        if (!techId && !isGraduated(b)) {
          renderSlotMachine();
          renderLogbook(b); renderAchievements(b);
          return;
        }
        if (MODE === "apocalypse") renderDayApocalypse(b);
        else if (MODE === "hell") renderDayHell(b);
        else renderDayVanilla(b);
        renderLogbook(b); renderAchievements(b);
      } catch (e) {
        document.getElementById("day-host").innerHTML = `
          <div class="errpanel">
            <strong>Render error:</strong> ${e.message}\n\n${e.stack || ""}
            <br><br><button class="ghost small" onclick="if(confirm('Reset bakery state?')){CatBakeryState.resetBakery();location.reload();}">Reset bakery</button>
          </div>`;
      }
    }

    function init() {
      if (!window.renderMathInElement) return setTimeout(init, 100);
      render();
    }
    init();
  </script>
</body>
</html>
